name: bonsai

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bonsai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: StevenBtw/gitbonsai@029c5e34ce0c9a429ee5e3a56f2859221b7f4ca7 # v0.5.1
        id: bonsai
        with:
          output-dir: assets
          snapshot: ${{ runner.temp }}/bonsai.snapshot.json
          legend: right
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.bonsai.outputs.light }}" "${{ steps.bonsai.outputs.dark }}"
          git diff --cached --quiet || git commit -m "Grow bonsai"
          git push
